<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Dashboard</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --text: #e6e8eb;
      --muted: #8a919c;
      --accent: #3d9bff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 4px 14px;
      border-bottom: 1px solid #232a33;
      margin-bottom: 14px;
    }
    header h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header h1 span { color: var(--accent); }
    header .clock {
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .widget-panel {
      background: var(--panel);
      border: 1px solid #232a33;
      border-radius: 10px;
      overflow: hidden;
      flex: 1;
    }
    footer {
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      padding-right: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Market <span>Dashboard</span></h1>
      <div class="clock" id="clock"></div>
    </header>

    <div class="widget-panel">
      <!-- TradingView Market Data Widget BEGIN -->
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
        {
          "width": "100%",
          "height": 1250,
          "symbolsGroups": [
            {
              "name": "미국 지수",
              "symbols": [
                { "name": "FOREXCOM:DJI", "displayName": "다우존스" },
                { "name": "FOREXCOM:SPXUSD", "displayName": "S&P 500" },
                { "name": "NASDAQ:ONEQ", "displayName": "나스닥 종합 (ONEQ)" },
                { "name": "FOREXCOM:NSXUSD", "displayName": "나스닥 100 (24H)" },
                { "name": "NASDAQ:SOXX", "displayName": "필라델피아 반도체 (SOXX)" },
                { "name": "CAPITALCOM:VIX", "displayName": "VIX" }
              ]
            },
            {
              "name": "한국 관련",
              "symbols": [
                { "name": "INDEX:KSIC", "displayName": "코스피" },
                { "name": "AMEX:EWY", "displayName": "EWY (MSCI Korea)" },
                { "name": "CBOE:DRAM", "displayName": "DRAM (메모리 ETF)" }
              ]
            },
            {
              "name": "환율",
              "symbols": [
                { "name": "CAPITALCOM:DXY", "displayName": "달러인덱스" },
                { "name": "FX_IDC:USDKRW", "displayName": "달러/원" },
                { "name": "FX:USDJPY", "displayName": "달러/엔" },
                { "name": "FX_IDC:USDCNH", "displayName": "달러/위안 (역외)" },
                { "name": "FX:EURUSD", "displayName": "유로/달러" },
                { "name": "FX:GBPUSD", "displayName": "파운드/달러" }
              ]
            },
            {
              "name": "미국 국채 금리",
              "symbols": [
                { "name": "FRED:DGS2", "displayName": "2년물 (전일)" },
                { "name": "FRED:DGS5", "displayName": "5년물 (전일)" },
                { "name": "FRED:DGS10", "displayName": "10년물 (전일)" },
                { "name": "FRED:DGS30", "displayName": "30년물 (전일)" }
              ]
            },
            {
              "name": "원자재",
              "symbols": [
                { "name": "TVC:USOIL", "displayName": "WTI" },
                { "name": "TVC:UKOIL", "displayName": "브렌트유" },
                { "name": "CMCMARKETS:GOLD", "displayName": "금" },
                { "name": "TVC:SILVER", "displayName": "은" }
              ]
            }
          ],
          "showSymbolLogo": true,
          "isTransparent": true,
          "colorTheme": "dark",
          "locale": "kr"
        }
        </script>
      </div>
      <!-- TradingView Market Data Widget END -->
    </div>

    <footer>Data by TradingView · 일부 심볼은 거래소 정책에 따라 지연 시세일 수 있습니다</footer>
  </div>

  <script>
    function tick() {
      const now = new Date();
      const kst = now.toLocaleString("ko-KR", {
        timeZone: "Asia/Seoul",
        month: "long", day: "numeric", weekday: "short",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      });
      document.getElementById("clock").textContent = kst + " KST";
    }
    tick();
    setInterval(tick, 1000);

  </script>
</body>
</html>
