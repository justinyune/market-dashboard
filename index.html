<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUSTIN's Market Dashboard</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --text: #e6e8eb;
      --muted: #8a919c; --accent: #3d9bff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 40px;
      display: flex; flex-direction: column; min-height: 100%; }
    header { display: flex; align-items: baseline; justify-content: space-between;
      padding: 4px 4px 14px; border-bottom: 1px solid #232a33; margin-bottom: 12px; }
    header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    header h1 span { color: var(--accent); }
    header .clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .tabs-nav { display: flex; gap: 8px; margin-bottom: 14px; }
    .tabs-nav button { background: var(--panel); color: var(--muted);
      border: 1px solid #232a33; border-radius: 8px; padding: 8px 22px;
      font-size: 14px; font-weight: 600; cursor: pointer; }
    .tabs-nav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

    .kr-panel { background: var(--panel); border: 1px solid #232a33; border-radius: 10px;
      margin-bottom: 14px; overflow: hidden; font-variant-numeric: tabular-nums; }
    .kr-panel .kr-head { padding: 12px 18px; font-size: 14px; font-weight: 700;
      border-bottom: 1px solid #232a33; }
    .kr-row { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 8px;
      align-items: center; padding: 11px 18px; font-size: 15px; border-bottom: 1px solid #1c232c; }
    .kr-row:last-child { border-bottom: none; }
    .kr-row .nm { font-weight: 600; font-size: 14px; }
    .kr-row .pr, .kr-row .df, .kr-row .pc { text-align: right; }
    .kr-note { padding: 8px 18px; font-size: 11px; color: var(--muted); text-align: right; }
    .up { color: #ef5350; }
    .down { color: #3d9bff; }
    .flat { color: var(--muted); }
    .kr-row.clickable { cursor: pointer; }
    .kr-row.clickable:hover { background: #1a212b; }
    .kr-chart { display: none; padding: 10px 18px 16px; border-bottom: 1px solid #1c232c; }
    .kr-chart.open { display: block; }
    .kr-chart .tabs { margin-bottom: 8px; }
    .kr-chart .tabs button { background: #232a33; color: var(--text); border: none;
      border-radius: 6px; padding: 4px 12px; margin-right: 6px; font-size: 12px; cursor: pointer; }
    .kr-chart .tabs button.on { background: var(--accent); color: #fff; }
    .kr-chart img { width: 100%; max-width: 700px; background: #fff; border-radius: 8px; display: block; }

    .widget-panel { background: var(--panel); border: 1px solid #232a33; border-radius: 10px;
      overflow: hidden; flex: 1; }
    .chart-panel { background: var(--panel); border: 1px solid #232a33; border-radius: 10px;
      overflow: hidden; margin-top: 14px; }
    .chart-panel .cp-head { padding: 12px 18px; font-size: 14px; font-weight: 700;
      border-bottom: 1px solid #232a33; }

    details.sector { background: var(--panel); border: 1px solid #232a33; border-radius: 10px;
      margin-bottom: 12px; overflow: hidden; }
    details.sector > summary { list-style: none; cursor: pointer; padding: 13px 18px;
      font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    details.sector > summary::-webkit-details-marker { display: none; }
    details.sector > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
    details.sector[open] > summary::before { transform: rotate(90deg); }
    details.sector > summary .cnt { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted); }
    .blk-label { padding: 9px 18px 7px; font-size: 12px; font-weight: 700; color: var(--muted);
      border-top: 1px solid #1c232c; background: #131820; }
    .us-widget { min-height: 60px; }
    .kr-sub { padding: 8px 18px 6px; font-size: 12px; font-weight: 700; color: var(--muted);
      background: #10151c; border-bottom: 1px solid #1c232c; }
    .stk-note { font-size: 11px; color: var(--muted); text-align: right; padding: 0 4px 10px; }

    footer { margin-top: 12px; font-size: 11px; color: var(--muted); text-align: right; padding-right: 4px; }
  </style>
</head>

    const MY_US = [
      ["NASDAQ:NVDA", "엔비디아"],
      ["NASDAQ:MU", "마이크론"]
    ];
    let myWidgetInited = false;
    function buildMyWidget() {
      if (myWidgetInited || !MY_US.length) return;
      const host = document.getElementById("usw-my");
      const cfg = {
        width: "100%", height: Math.max(160, MY_US.length * 44 + 120),
        symbolsGroups: [{ name: "매수 관심", symbols: MY_US.map(p => ({ name: p[0], displayName: (p[1] || "") + " (" + p[0].split(":")[1] + ")" })) }],
        showSymbolLogo: true, isTransparent: true, colorTheme: "dark", locale: "kr"
      };
      const box = document.createElement("div");
      box.className = "tradingview-widget-container";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      const sc = document.createElement("script");
      sc.type = "text/javascript";
      sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js";
      sc.async = true;
      sc.innerHTML = JSON.stringify(cfg);
      box.appendChild(inner);
      box.appendChild(sc);
      host.appendChild(box);
      myWidgetInited = true;
    }

    // ===== 섹터 아코디언 DOM 생성 =====
    (function buildSectors() {
      const root = document.getElementById("sectors");
      SECTORS.forEach((sec, i) => {
        const d = document.createElement("details");
        d.className = "sector";
        d.dataset.sec = sec.id;
        if (i === 0) d.setAttribute("open", "");
        const total = sec.groups.reduce((n, g) => n + g.syms.length, 0);
        d.innerHTML =
          '<summary>' + sec.name + '<span class="cnt">🇺🇸 ' + total + ' · 🇰🇷 <span id="krcnt-' + sec.id + '">0</span></span></summary>' +
          '<div class="blk-label">🇺🇸 미국</div>' +
          '<div class="us-widget" id="usw-' + sec.id + '"></div>' +
          '<div class="blk-label">🇰🇷 한국</div>' +
          '<div id="krsec-' + sec.id + '"><div class="kr-row"><span class="nm flat">-</span></div></div>';
        d.addEventListener("toggle", initVisibleWidgets);
        root.appendChild(d);
      });
    })();

    // ===== 미국 위젯 지연 생성 =====
    const widgetInited = {};
    function buildUsWidget(sec) {
      const host = document.getElementById("usw-" + sec.id);
      const cfg = {
        width: "100%", height: sec.h,
        symbolsGroups: sec.groups.map(g => ({
          name: g.name,
          symbols: g.syms.map(p => ({ name: p[0], displayName: (p[1] || "") + " (" + p[0].split(":")[1] + ")" }))
        })),
        showSymbolLogo: true, isTransparent: true, colorTheme: "dark", locale: "kr"
      };
      const box = document.createElement("div");
      box.className = "tradingview-widget-container";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      const sc = document.createElement("script");
      sc.type = "text/javascript";
      sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js";
      sc.async = true;
      sc.innerHTML = JSON.stringify(cfg);
      box.appendChild(inner);
      box.appendChild(sc);
      host.appendChild(box);
      widgetInited[sec.id] = true;
    }
    function initVisibleWidgets() {
      if (document.getElementById("tab-stocks").hidden) return;
      SECTORS.forEach(sec => {
        const d = document.querySelector('details[data-sec="' + sec.id + '"]');
        if (d && d.open && !widgetInited[sec.id]) buildUsWidget(sec);
      });
    }

    // ===== 탭 =====
    document.querySelectorAll(".tabs-nav button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tabs-nav button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        document.getElementById("tab-market").hidden = btn.dataset.tab !== "market";
        document.getElementById("tab-my").hidden = btn.dataset.tab !== "my";
        document.getElementById("tab-stocks").hidden = btn.dataset.tab !== "stocks";
        if (btn.dataset.tab === "stocks") initVisibleWidgets();
        if (btn.dataset.tab === "my") buildMyWidget();
      };
    });

    // ===== 한국 시세/차트 =====
    const openCharts = {};
    let krData = null;
    const UP = "#ef5350", DOWN = "#3d9bff";

    function intraUrl(code) {
      const t = Math.floor(Date.now() / 60000);
      return (code.length === 6)
        ? "https://ssl.pstatic.net/imgfinance/chart/item/area/day/" + code + ".png?t=" + t
        : "https://ssl.pstatic.net/imgfinance/chart/mobile/day/" + code + "_end.png?t=" + t;
    }
    function stockCandleUrl(code, period) {
      const t = Math.floor(Date.now() / 60000);
      return "https://ssl.pstatic.net/imgfinance/chart/item/candle/" + period + "/" + code + ".png?t=" + t;
    }

    function isoWeekKey(ds) {
      const dt = new Date(ds + "T00:00:00Z");
      const day = (dt.getUTCDay() + 6) % 7;
      dt.setUTCDate(dt.getUTCDate() - day + 3);
      const firstThu = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
      const week = 1 + Math.round(((dt - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
      return dt.getUTCFullYear() + "-W" + String(week).padStart(2, "0");
    }
    function aggregate(bars, mode) {
      if (mode === "day") return bars;
      const keyFn = mode === "week" ? (b => isoWeekKey(b.d)) : (b => b.d.slice(0, 7));
      const out = [];
      let cur = null, curKey = null;
      bars.forEach(b => {
        const k = keyFn(b);
        if (k !== curKey) {
          if (cur) out.push(cur);
          cur = { d: b.d, o: b.o, h: b.h, l: b.l, c: b.c };
          curKey = k;
        } else {
          cur.h = Math.max(cur.h, b.h);
          cur.l = Math.min(cur.l, b.l);
          cur.c = b.c;
        }
      });
      if (cur) out.push(cur);
      return out;
    }

    // ----- 선물 인트라데이 차트 (주간 09:00 ~ 야간 익일 05:00, KST) -----
    function renderFutIntra(container) {
      const pts = (krData && krData.fut_intraday) || [];
      if (pts.length < 2) return false;
      const base = krData.fut_base;
      const W = 700, H = 320, padL = 8, padR = 64, padT = 14, padB = 26;
      const sessionStart = (() => {
        const d = new Date(pts[0].ts * 1000);
        const kstH = (d.getUTCHours() + 9) % 24;
        const day = new Date(d.getTime());
        if (kstH < 9) day.setUTCDate(day.getUTCDate() - 1);
        day.setUTCHours(0, 0, 0, 0);
        return day.getTime() / 1000;
      })();
      const spanS = 20 * 3600;
      const xOf = ts => padL + Math.min(1, Math.max(0, (ts - sessionStart) / spanS)) * (W - padL - padR);
      const vals = pts.map(q => q.p).concat(base ? [base] : []);
      const hi = Math.max(...vals), lo = Math.min(...vals);
      const pad = (hi - lo) * 0.1 || 1;
      const yHi = hi + pad, yLo = lo - pad;
      const y = v => padT + (yHi - v) / (yHi - yLo) * (H - padT - padB);
      let el = "";
      const nx = padL + (9 * 3600 / spanS) * (W - padL - padR);
      el += '<rect x="' + nx + '" y="' + padT + '" width="' + (W - 64 - nx) + '" height="' + (H - padT - padB) + '" fill="#1b2230" opacity="0.55"/>';
      el += '<text x="' + (nx + 5) + '" y="' + (padT + 13) + '" fill="#5d6673" font-size="11">야간</text>';
      if (base) {
        el += '<line x1="' + padL + '" y1="' + y(base) + '" x2="' + (W - padR) + '" y2="' + y(base) + '" stroke="#8a919c" stroke-width="1" stroke-dasharray="2,3"/>';
        el += '<text x="' + (W - padR + 6) + '" y="' + (y(base) + 4) + '" fill="#8a919c" font-size="11">' + base.toFixed(2) + '</text>';
      }
      const last = pts[pts.length - 1];
      const col = base ? (last.p >= base ? UP : DOWN) : "#e6e8eb";
      let path = "", prevTs = null;
      pts.forEach(q => {
        const cmd = (prevTs !== null && q.ts - prevTs < 1800) ? "L" : "M";
        path += cmd + xOf(q.ts).toFixed(1) + "," + y(q.p).toFixed(1);
        prevTs = q.ts;
      });
      el += '<path d="' + path + '" fill="none" stroke="' + col + '" stroke-width="1.8"/>';
      el += '<circle cx="' + xOf(last.ts) + '" cy="' + y(last.p) + '" r="3" fill="' + col + '"/>';
      el += '<text x="' + (W - padR + 6) + '" y="' + (y(last.p) + 4) + '" fill="' + col + '" font-size="12" font-weight="bold">' + last.p.toFixed(2) + '</text>';
      [[0,"09시"],[3,"12시"],[6,"15시"],[9,"18시"],[12,"21시"],[15,"24시"],[18,"03시"],[20,"05시"]].forEach(([h, lab]) => {
        const x = padL + (h * 3600 / spanS) * (W - padL - padR);
        el += '<line x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (H - padB) + '" stroke="#232a33" stroke-width="0.5"/>';
        el += '<text x="' + x + '" y="' + (H - 8) + '" fill="#8a919c" font-size="11" text-anchor="middle">' + lab + '</text>';
      });
      container.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:700px;background:#11151b;border:1px solid #232a33;border-radius:8px;display:block">' + el + '</svg>' +
        '<div style="font-size:11px;color:var(--muted);padding:4px 2px;">주간 09:00~15:45 · 야간 18:00~익일 05:00 (KST) · 5분 수집</div>';
      return true;
    }

    // ----- SVG 캔들차트 (이동평균선 포함) -----
    const MA_SET = { day: [[5, "#26a69a"], [20, "#ef5350"], [60, "#ff9800"], [120, "#ab47bc"], [240, "#78909c"]],
                     week: [[5, "#26a69a"], [20, "#ef5350"], [60, "#ff9800"]],
                     month: [[5, "#26a69a"], [12, "#ff9800"]] };

    function renderCandles(container, allBars, mode) {
      const counts = { day: 60, week: 52, month: 24 };
      const agg = aggregate(allBars, mode);
      const maDefs = MA_SET[mode] || [];
      const n = counts[mode];
      const bars = agg.slice(-n);
      if (!bars.length) return false;
      const offset = agg.length - bars.length;
      const W = 700, H = 340, padL = 8, padR = 64, padT = 26, padB = 22;
      const hi = Math.max(...bars.map(b => b.h));
      const lo = Math.min(...bars.map(b => b.l));
      const span = (hi - lo) || 1;
      const y = v => padT + (hi - v) / span * (H - padT - padB);
      const cw = (W - padL - padR) / bars.length;
      const bw = Math.max(2, cw * 0.62);
      const xAt = i => padL + i * cw + cw / 2;
      let el = "";
      const fmt = v => v >= 1000 ? v.toLocaleString("ko-KR", { maximumFractionDigits: 0 }) : v.toFixed(2);
      [hi, (hi + lo) / 2, lo].forEach(v => {
        el += '<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) + '" stroke="#2a323d" stroke-width="0.5" stroke-dasharray="3,4"/>';
        el += '<text x="' + (W - padR + 6) + '" y="' + (y(v) + 4) + '" fill="#8a919c" font-size="12">' + fmt(v) + '</text>';
      });
      maDefs.forEach(([period, color]) => {
        let path = "", started = false;
        for (let i = 0; i < bars.length; i++) {
          const gi = offset + i;
          if (gi + 1 < period) continue;
          let sum = 0;
          for (let k = gi - period + 1; k <= gi; k++) sum += agg[k].c;
          const v = sum / period;
          path += (started ? "L" : "M") + xAt(i).toFixed(1) + "," + y(v).toFixed(1);
          started = true;
        }
        if (path) el += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="1.3" opacity="0.9"/>';
      });
      bars.forEach((b, i) => {
        const x = xAt(i);
        const up = b.c >= b.o;
        const col = up ? UP : DOWN;
        el += '<line x1="' + x + '" y1="' + y(b.h) + '" x2="' + x + '" y2="' + y(b.l) + '" stroke="' + col + '" stroke-width="1"/>';
        const top = y(Math.max(b.o, b.c)), bot = y(Math.min(b.o, b.c));
        el += '<rect x="' + (x - bw / 2) + '" y="' + top + '" width="' + bw + '" height="' + Math.max(1, bot - top) + '" fill="' + col + '"/>';
      });
      let lx = padL + 2;
      maDefs.forEach(([period, color]) => {
        el += '<rect x="' + lx + '" y="8" width="9" height="9" fill="' + color + '"/>';
        el += '<text x="' + (lx + 13) + '" y="16" fill="#8a919c" font-size="11">' + period + '</text>';
        lx += 13 + String(period).length * 7 + 14;
      });
      const first = bars[0].d.slice(2), last = bars[bars.length - 1].d.slice(2);
      el += '<text x="' + padL + '" y="' + (H - 6) + '" fill="#8a919c" font-size="11">' + first + '</text>';
      el += '<text x="' + (W - padR) + '" y="' + (H - 6) + '" fill="#8a919c" font-size="11" text-anchor="end">' + last + '</text>';
      container.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:700px;background:#11151b;border:1px solid #232a33;border-radius:8px;display:block">' + el + '</svg>';
      return true;
    }

    // ----- 차트 박스 -----
    function makeChartBox(item) {
      const code = item.code;
      const isStock = item.group === "stock";
      const box = document.createElement("div");
      box.className = "kr-chart" + (openCharts[code] ? " open" : "");
      const tabs = document.createElement("div");
      tabs.className = "tabs";
      const cv = document.createElement("div");
      const fbLink = code === "FUT"
        ? '<a href="https://www.tradingview.com/symbols/KRX-K2I1!/" target="_blank" style="color:var(--accent)">TradingView에서 보기 (야간 차트 포함) ↗</a>'
        : (isStock
          ? '<a href="https://m.stock.naver.com/domestic/stock/' + code + '/total" target="_blank" style="color:var(--accent)">네이버 증권에서 보기 ↗</a>'
          : '<a href="https://m.stock.naver.com/domestic/index/' + code + '/total" target="_blank" style="color:var(--accent)">네이버 증권에서 보기 ↗</a>');

      function show(period) {
        openCharts[code] = period;
        tabs.querySelectorAll("button").forEach(b => b.className = b.dataset.p === period ? "on" : "");
        if (period === "intra") {
          if (code === "FUT" && renderFutIntra(cv)) return;
          const img = document.createElement("img");
          img.alt = "차트";
          img.onerror = () => { cv.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:6px 2px;">차트를 불러올 수 없습니다 · ' + fbLink + '</div>'; };
          img.src = intraUrl(code);
          cv.innerHTML = "";
          cv.appendChild(img);
          return;
        }
        if (isStock) {
          const img = document.createElement("img");
          img.alt = "차트";
          img.onerror = () => { cv.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:6px 2px;">차트를 불러올 수 없습니다 · ' + fbLink + '</div>'; };
          img.src = stockCandleUrl(code, period);
          cv.innerHTML = "";
          cv.appendChild(img);
        } else {
          const bars = krData && krData.history && krData.history[code];
          if (!bars || !renderCandles(cv, bars, period)) {
            cv.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:6px 2px;">차트 데이터가 아직 없습니다 · ' + fbLink + '</div>';
          }
        }
      }

      [["intra", "당일"], ["day", "일봉"], ["week", "주봉"], ["month", "월봉"]].forEach(([pv, label]) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.dataset.p = pv;
        b.onclick = (e) => { e.stopPropagation(); show(pv); };
        tabs.appendChild(b);
      });
      box.appendChild(tabs);
      box.appendChild(cv);
      box._show = show;
      return box;
    }

    function renderRows(container, list) {
      container.innerHTML = "";
      list.forEach(item => {
        const code = item.code;
        const row = document.createElement("div");
        row.className = "kr-row" + (code ? " clickable" : "");
        if (item.error !== undefined) {
          row.innerHTML = '<span class="nm">' + item.name + '</span><span class="pr flat">—</span><span class="df flat">조회 실패</span><span class="pc"></span>';
          container.appendChild(row);
          return;
        }
        const fmt = n => item.krw
          ? Math.round(n).toLocaleString("ko-KR")
          : n.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const cls = item.diff > 0 ? "up" : (item.diff < 0 ? "down" : "flat");
        const sign = item.diff > 0 ? "+" : "";
        const codeTag = (item.group === "stock" || item.group === "mystock")
          ? ' <span style="font-size:11px;color:var(--muted);font-weight:400">' + code + '</span>' : '';
        row.innerHTML =
          '<span class="nm">' + item.name + codeTag + ' <span style="font-size:11px;color:var(--muted)">▾</span></span>' +
          '<span class="pr">' + fmt(item.price) + '</span>' +
          '<span class="df ' + cls + '">' + sign + fmt(item.diff) + '</span>' +
          '<span class="pc ' + cls + '">' + sign + item.pct.toFixed(2) + '%</span>';
        container.appendChild(row);
        const chartBox = makeChartBox(item);
        row.onclick = () => {
          if (openCharts[code]) {
            delete openCharts[code];
            chartBox.classList.remove("open");
          } else {
            chartBox.classList.add("open");
            chartBox._show("intra");
          }
        };
        if (openCharts[code]) chartBox._show(openCharts[code]);
        container.appendChild(chartBox);
      });
    }

    function renderRowsGrouped(container, list) {
      container.innerHTML = "";
      const seen = [];
      const bySub = {};
      list.forEach(i => {
        const k = i.sub || "";
        if (!(k in bySub)) { bySub[k] = []; seen.push(k); }
        bySub[k].push(i);
      });
      const multi = seen.length > 1 || (seen.length === 1 && seen[0] !== "");
      seen.forEach(k => {
        if (multi && k) {
          const h = document.createElement("div");
          h.className = "kr-sub";
          h.textContent = k;
          container.appendChild(h);
        }
        const tmp = document.createElement("div");
        renderRows(tmp, bySub[k]);
        while (tmp.children.length) container.appendChild(tmp.children[0]);
      });
    }

    async function renderKr() {
      const note = document.getElementById("kr-note");
      try {
        const res = await fetch("quotes.json?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) krData = await res.json();
      } catch (e) { /* ignore */ }
      if (!krData || !krData.items) {
        note.textContent = "시세 파일 대기 중 (Actions 첫 실행 전이거나 일시 오류)";
        return;
      }
      const idx = krData.items.filter(i => i.group === "index");
      const stk = krData.items.filter(i => i.group === "stock");
      renderRows(document.getElementById("kr-idx-rows"), idx);

      const bySec = {};
      stk.forEach(i => {
        const k = i.sector || "etc";
        (bySec[k] = bySec[k] || []).push(i);
      });
      SECTORS.forEach(sec => {
        const el = document.getElementById("krsec-" + sec.id);
        const cnt = document.getElementById("krcnt-" + sec.id);
        const list = bySec[sec.id] || [];
        if (cnt) cnt.textContent = list.length;
        if (el) {
          if (list.length) renderRowsGrouped(el, list);
          else el.innerHTML = '<div class="kr-row"><span class="nm flat">등록된 한국 종목 없음</span></div>';
        }
      });

      const my = krData.items.filter(i => i.group === "mystock");
      const myEl = document.getElementById("krsec-my");
      if (myEl) {
        if (my.length) renderRows(myEl, my);
        else myEl.innerHTML = '<div class="kr-row"><span class="nm flat">fetch_quotes.py의 MY_STOCKS에 종목을 추가하세요</span></div>';
      }

      const t = "네이버 증권 · " + krData.updated + " 기준 · 5분 주기 갱신 · 행 클릭 시 차트";
      note.textContent = t;
      document.getElementById("stk-note").textContent = t;
      document.getElementById("my-note").textContent = t;
    }
    renderKr();
    setInterval(renderKr, 120000);
  </script>
</body>
