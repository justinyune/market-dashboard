<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUSTIN's Market Dashboard</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --text: #e6e8eb;
      --muted: #8a919c;
      --accent: #3d9bff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 4px 14px;
      border-bottom: 1px solid #232a33;
      margin-bottom: 14px;
    }
    header h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header h1 span { color: var(--accent); }
    header .clock {
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .kr-panel {
      background: var(--panel);
      border: 1px solid #232a33;
      border-radius: 10px;
      margin-bottom: 14px;
      overflow: hidden;
      font-variant-numeric: tabular-nums;
    }
    .kr-panel .kr-head {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #232a33;
    }
    .kr-row {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 11px 18px;
      font-size: 15px;
      border-bottom: 1px solid #1c232c;
    }
    .kr-row:last-child { border-bottom: none; }
    .kr-row .nm { font-weight: 600; font-size: 14px; }
    .kr-row .pr, .kr-row .df, .kr-row .pc { text-align: right; }
    .kr-note {
      padding: 8px 18px;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }
    .up { color: #ef5350; }
    .down { color: #3d9bff; }
    .flat { color: var(--muted); }
    .kr-row.clickable { cursor: pointer; }
    .kr-row.clickable:hover { background: #1a212b; }
    .kr-chart {
      display: none;
      padding: 10px 18px 16px;
      border-bottom: 1px solid #1c232c;
    }
    .kr-chart.open { display: block; }
    .kr-chart .tabs { margin-bottom: 8px; }
    .kr-chart .tabs button {
      background: #232a33;
      color: var(--text);
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      margin-right: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .kr-chart .tabs button.on { background: var(--accent); color: #fff; }
    .kr-chart img {
      width: 100%;
      max-width: 700px;
      background: #fff;
      border-radius: 8px;
      display: block;
    }
    .chart-panel {
      background: var(--panel);
      border: 1px solid #232a33;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 14px;
    }
    .chart-panel .cp-head {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #232a33;
    }
    .widget-panel {
      background: var(--panel);
      border: 1px solid #232a33;
      border-radius: 10px;
      overflow: hidden;
      flex: 1;
    }
    footer {
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      padding-right: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>JUSTIN's <span>MarketDashboard</span></h1>
      <div class="clock" id="clock"></div>
    </header>

        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
        {

    <div class="chart-panel">

      <!-- TradingView Symbol Overview Widget BEGIN -->
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
        {

            ["코스피", "INDEX:KSIC|3M"],
            ["EWY", "AMEX:EWY|3M"],
            ["DRAM", "CBOE:DRAM|3M"],
            ["달러/원", "FX_IDC:USDKRW|3M"],
            ["달러/엔", "FX:USDJPY|3M"],
            ["달러인덱스", "CAPITALCOM:DXY|3M"],

            ["금", "CMCMARKETS:GOLD|3M"]
          ],

    </div>

    <div class="kr-panel" style="margin-top:14px">
      <div class="kr-head">🇰🇷 관심종목</div>
      <div id="kr-stk-rows">
        <div class="kr-row"><span class="nm">로딩 중...</span><span class="pr"></span><span class="df"></span><span class="pc"></span></div>
      </div>
      <div class="kr-note" id="kr-note">네이버 증권</div>
    </div>

    <footer>Data by TradingView · 일부 심볼은 거래소 정책에 따라 지연 시세일 수 있습니다</footer>
  </div>

  <script>
    function tick() {
      const now = new Date();
      const kst = now.toLocaleString("ko-KR", {
        timeZone: "Asia/Seoul",
        month: "long", day: "numeric", weekday: "short",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      });
      document.getElementById("clock").textContent = kst + " KST";
    }
    tick();
    setInterval(tick, 1000);

    const openCharts = {};
    let krData = null;

    const UP = "#ef5350", DOWN = "#3d9bff";

    function intraUrl(code) {
      const t = Math.floor(Date.now() / 60000);
      const suffix = (code === "005930" || code === "000660") ? code : code + "";
      return (code.length === 6)
        ? "https://ssl.pstatic.net/imgfinance/chart/item/area/day/" + code + ".png?t=" + t
        : "https://ssl.pstatic.net/imgfinance/chart/mobile/day/" + code + "_end.png?t=" + t;
    }
    function stockCandleUrl(code, period) {
      const t = Math.floor(Date.now() / 60000);
      return "https://ssl.pstatic.net/imgfinance/chart/item/candle/" + period + "/" + code + ".png?t=" + t;
    }

    // ----- 일별 데이터 -> 주봉/월봉 집계 -----
    function isoWeekKey(ds) {
      const dt = new Date(ds + "T00:00:00Z");
      const day = (dt.getUTCDay() + 6) % 7;
      dt.setUTCDate(dt.getUTCDate() - day + 3);
      const firstThu = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
      const week = 1 + Math.round(((dt - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
      return dt.getUTCFullYear() + "-W" + String(week).padStart(2, "0");
    }
    function aggregate(bars, mode) {
      if (mode === "day") return bars;
      const keyFn = mode === "week" ? (b => isoWeekKey(b.d)) : (b => b.d.slice(0, 7));
      const out = [];
      let cur = null, curKey = null;
      bars.forEach(b => {
        const k = keyFn(b);
        if (k !== curKey) {
          if (cur) out.push(cur);
          cur = { d: b.d, o: b.o, h: b.h, l: b.l, c: b.c };
          curKey = k;
        } else {
          cur.h = Math.max(cur.h, b.h);
          cur.l = Math.min(cur.l, b.l);
          cur.c = b.c;
        }
      });
      if (cur) out.push(cur);
      return out;
    }

    // ----- SVG 캔들차트 (이동평균선 포함) -----
    const MA_SET = { day: [[5, "#26a69a"], [20, "#ef5350"], [60, "#ff9800"], [120, "#ab47bc"], [240, "#78909c"]],
                     week: [[5, "#26a69a"], [20, "#ef5350"], [60, "#ff9800"]],
                     month: [[5, "#26a69a"], [12, "#ff9800"]] };

    function renderCandles(container, allBars, mode) {
      const counts = { day: 60, week: 52, month: 24 };
      const agg = aggregate(allBars, mode);
      const maDefs = MA_SET[mode] || [];
      const maxMa = maDefs.length ? Math.max(...maDefs.map(m => m[0])) : 0;
      const n = counts[mode];
      const bars = agg.slice(-n);
      if (!bars.length) return false;
      const offset = agg.length - bars.length;  // 전체 배열에서 표시 구간 시작 위치

      const W = 700, H = 340, padL = 8, padR = 64, padT = 26, padB = 22;
      const hi = Math.max(...bars.map(b => b.h));
      const lo = Math.min(...bars.map(b => b.l));
      const span = (hi - lo) || 1;
      const y = v => padT + (hi - v) / span * (H - padT - padB);
      const cw = (W - padL - padR) / bars.length;
      const bw = Math.max(2, cw * 0.62);
      const xAt = i => padL + i * cw + cw / 2;
      let el = "";

      // 눈금
      const fmt = v => v >= 1000 ? v.toLocaleString("ko-KR", { maximumFractionDigits: 0 }) : v.toFixed(2);
      [hi, (hi + lo) / 2, lo].forEach(v => {
        el += '<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) + '" stroke="#2a323d" stroke-width="0.5" stroke-dasharray="3,4"/>';
        el += '<text x="' + (W - padR + 6) + '" y="' + (y(v) + 4) + '" fill="#8a919c" font-size="12">' + fmt(v) + '</text>';
      });

      // 이동평균선 (표시 구간 이전 데이터까지 활용해 계산)
      maDefs.forEach(([period, color]) => {
        let path = "", started = false;
        for (let i = 0; i < bars.length; i++) {
          const gi = offset + i;  // 전체 배열 인덱스
          if (gi + 1 < period) continue;
          let sum = 0;
          for (let k = gi - period + 1; k <= gi; k++) sum += agg[k].c;
          const v = sum / period;
          if (v > hi || v < lo) { /* 범위 밖이어도 그리되 클리핑은 생략 */ }
          path += (started ? "L" : "M") + xAt(i).toFixed(1) + "," + y(v).toFixed(1);
          started = true;
        }
        if (path) el += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="1.3" opacity="0.9"/>';
      });

      // 캔들
      bars.forEach((b, i) => {
        const x = xAt(i);
        const up = b.c >= b.o;
        const col = up ? UP : DOWN;
        el += '<line x1="' + x + '" y1="' + y(b.h) + '" x2="' + x + '" y2="' + y(b.l) + '" stroke="' + col + '" stroke-width="1"/>';
        const top = y(Math.max(b.o, b.c)), bot = y(Math.min(b.o, b.c));
        el += '<rect x="' + (x - bw / 2) + '" y="' + top + '" width="' + bw + '" height="' + Math.max(1, bot - top) + '" fill="' + col + '"/>';
      });

      // 범례 + 기간
      let lx = padL + 2;
      maDefs.forEach(([period, color]) => {
        el += '<rect x="' + lx + '" y="8" width="9" height="9" fill="' + color + '"/>';
        el += '<text x="' + (lx + 13) + '" y="16" fill="#8a919c" font-size="11">' + period + '</text>';
        lx += 13 + String(period).length * 7 + 14;
      });
      const first = bars[0].d.slice(2), last = bars[bars.length - 1].d.slice(2);
      el += '<text x="' + padL + '" y="' + (H - 6) + '" fill="#8a919c" font-size="11">' + first + '</text>';
      el += '<text x="' + (W - padR) + '" y="' + (H - 6) + '" fill="#8a919c" font-size="11" text-anchor="end">' + last + '</text>';

      container.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:700px;background:#11151b;border:1px solid #232a33;border-radius:8px;display:block">' + el + '</svg>';
      return true;
    }

    // ----- 차트 박스 -----
    function makeChartBox(item) {
      const code = item.code;
      const isStock = item.group === "stock";
      const box = document.createElement("div");
      box.className = "kr-chart" + (openCharts[code] ? " open" : "");
      const tabs = document.createElement("div");
      tabs.className = "tabs";
      const cv = document.createElement("div");

      const fbLink = code === "FUT"
        ? '<a href="https://www.tradingview.com/symbols/KRX-K2I1!/" target="_blank" style="color:var(--accent)">TradingView에서 보기 (야간 차트 포함) ↗</a>'
        : (isStock
          ? '<a href="https://m.stock.naver.com/domestic/stock/' + code + '/total" target="_blank" style="color:var(--accent)">네이버 증권에서 보기 ↗</a>'
          : '<a href="https://m.stock.naver.com/domestic/index/' + code + '/total" target="_blank" style="color:var(--accent)">네이버 증권에서 보기 ↗</a>');

      function show(period) {
        openCharts[code] = period;
        tabs.querySelectorAll("button").forEach(b => b.className = b.dataset.p === period ? "on" : "");
        if (period === "intra") {
          const img = document.createElement("img");
          img.alt = "차트";
          img.onerror = () => { cv.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:6px 2px;">차트를 불러올 수 없습니다 · ' + fbLink + '</div>'; };
          img.src = intraUrl(code);
          cv.innerHTML = "";
          cv.appendChild(img);
          return;
        }
        if (isStock) {
          const img = document.createElement("img");
          img.alt = "차트";
          img.onerror = () => { cv.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:6px 2px;">차트를 불러올 수 없습니다 · ' + fbLink + '</div>'; };
          img.src = stockCandleUrl(code, period);
          cv.innerHTML = "";
          cv.appendChild(img);
        } else {
          const bars = krData && krData.history && krData.history[code];
          if (!bars || !renderCandles(cv, bars, period)) {
            cv.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:6px 2px;">차트 데이터가 아직 없습니다 · ' + fbLink + '</div>';
          }
        }
      }

      [["intra", "당일"], ["day", "일봉"], ["week", "주봉"], ["month", "월봉"]].forEach(([pv, label]) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.dataset.p = pv;
        b.onclick = (e) => { e.stopPropagation(); show(pv); };
        tabs.appendChild(b);
      });
      box.appendChild(tabs);
      box.appendChild(cv);
      box._show = show;
      return box;
    }

    function renderRows(containerId, list) {
      const box = document.getElementById(containerId);
      box.innerHTML = "";
      list.forEach(item => {
        const code = item.code;
        const row = document.createElement("div");
        row.className = "kr-row" + (code ? " clickable" : "");
        if (item.error !== undefined) {
          row.innerHTML = '<span class="nm">' + item.name + '</span><span class="pr flat">—</span><span class="df flat">조회 실패</span><span class="pc"></span>';
          box.appendChild(row);
          return;
        }
        const fmt = n => item.krw
          ? Math.round(n).toLocaleString("ko-KR")
          : n.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const cls = item.diff > 0 ? "up" : (item.diff < 0 ? "down" : "flat");
        const sign = item.diff > 0 ? "+" : "";
        row.innerHTML =
          '<span class="nm">' + item.name + ' <span style="font-size:11px;color:var(--muted)">▾</span></span>' +
          '<span class="pr">' + fmt(item.price) + '</span>' +
          '<span class="df ' + cls + '">' + sign + fmt(item.diff) + '</span>' +
          '<span class="pc ' + cls + '">' + sign + item.pct.toFixed(2) + '%</span>';
        box.appendChild(row);
        const chartBox = makeChartBox(item);
        row.onclick = () => {
          if (openCharts[code]) {
            delete openCharts[code];
            chartBox.classList.remove("open");
          } else {
            chartBox.classList.add("open");
            chartBox._show("intra");
          }
        };
        if (openCharts[code]) chartBox._show(openCharts[code]);
        box.appendChild(chartBox);
      });
    }

    async function renderKr() {
      const note = document.getElementById("kr-note");
      try {
        const res = await fetch("quotes.json?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) krData = await res.json();
      } catch (e) { /* ignore */ }
      if (!krData || !krData.items) {
        note.textContent = "시세 파일 대기 중 (Actions 첫 실행 전이거나 일시 오류)";
        return;
      }
      const idx = krData.items.filter(i => i.group === "index" || ["코스피", "코스닥", "코스피200 선물", "코스닥 지수"].includes(i.name));
      const stk = krData.items.filter(i => !idx.includes(i));
      renderRows("kr-idx-rows", idx);
      renderRows("kr-stk-rows", stk);
      note.textContent = "네이버 증권 · " + krData.updated + " 기준 · 5분 주기 갱신 · 행 클릭 시 차트";
    }
    renderKr();
    setInterval(renderKr, 120000);
  </script>
</body>
</html>
