name: Update KR quotes
 
on:
  schedule:
    - cron: "3-58/5 0-20 * * 1-5"
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: kr-quotes
  cancel-in-progress: true
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
 
      - name: Fetch quotes from Naver
        run: python3 fetch_quotes.py
 
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update KR quotes"
            git push || (git pull --rebase && git push)
          fi
